name: Android 内部预发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  CI: 'true'

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 检出标签代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 配置 Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: 配置 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装锁定依赖
        run: npm ci

      - name: 核对标签与版本
        run: |
          set -euo pipefail
          npm run build:apk -- --check
          version="$(node -p 'require("./package.json").version')"
          tagBase="v$version"
          if [[ "$GITHUB_REF_NAME" != "$tagBase" ]]; then
            previewNumber="${GITHUB_REF_NAME#"$tagBase-preview."}"
            if [[ "$GITHUB_REF_NAME" != "$tagBase-preview.$previewNumber" || ! "$previewNumber" =~ ^[1-9][0-9]*$ ]]; then
              printf '%s\n' '标签必须与应用版本一致，或使用同版本的 -preview.正整数 重试标签'
              exit 1
            fi
          fi
          test -f "docs/releases/$tagBase.md"

      - name: 执行质量检查
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run format:check

      - name: 准备 Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: 构建常规安装包
        run: npm run build:apk

      - name: 校验 APK 并生成摘要
        run: |
          set -euo pipefail
          apks=(dist/*.apk)
          test "${#apks[@]}" -eq 1
          test -f "${apks[0]}"
          version="$(node -p 'require("./package.json").version')"
          versionCode="$(node -p 'require("./app.json").expo.android.versionCode')"
          buildTools="$ANDROID_HOME/build-tools/36.0.0"
          badging="$("$buildTools/aapt" dump badging "${apks[0]}")"
          expected="package: name='com.smallsteps.checkin' versionCode='$versionCode' versionName='$version'"
          if [[ "$badging" != "$expected"* ]]; then
            printf '%s\n' 'APK 包名或版本与标签代码不一致'
            exit 1
          fi
          printf '%s\n' "$badging" > dist/APK-METADATA.txt
          "$buildTools/apksigner" verify --verbose --print-certs "${apks[0]}" | tee dist/APK-SIGNATURE.txt
          # 仅接受仓库已有的 Android Debug 证书，不在此流程更换签名。
          grep -Fqx 'Signer #1 certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' dist/APK-SIGNATURE.txt
          printf 'commit=%s\ntag=%s\nversion=%s\nversionCode=%s\npackage=com.smallsteps.checkin\nsigning=Android Debug\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$version" "$versionCode" > dist/BUILD-INFO.txt
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)

      - name: 保留已核验安装包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-prerelease-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/APK-METADATA.txt
            dist/APK-SIGNATURE.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出发布说明
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 获取已核验安装包
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-prerelease-${{ github.sha }}
          path: dist

      - name: 核对传输摘要
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: 将完整附件上传至预发布草稿
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          gh release create "$TAG_NAME" \
            --verify-tag --draft --prerelease --latest=false \
            --title "小步日常 ${TAG_NAME#v} · 内部预发布（调试签名）" \
            --notes-file "docs/releases/v$version.md" \
            dist/*.apk dist/SHA256SUMS.txt dist/APK-METADATA.txt \
            dist/APK-SIGNATURE.txt dist/BUILD-INFO.txt

      - name: 发布完整预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false --prerelease --latest=false
